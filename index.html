<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>중마고 앱</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.app{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:35px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

/* 메인 */
.home{
    padding:50px 30px;
    text-align:center;
}

.logo{
    font-size:60px;
    margin-bottom:20px;
}

.title{
    font-size:40px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:gray;
    margin-bottom:40px;
}

.menu-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    margin-bottom:15px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* 화면 */
.screen{
    display:none;
    padding:25px;
}

.top-bar{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#f1f1f1;
    font-size:20px;
    cursor:pointer;
}

.screen-title{
    flex:1;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-right:45px;
}

.date{
    text-align:center;
    color:gray;
    margin-bottom:20px;
}

/* 카드 */
.card{
    background:#f7f7fb;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.card-title{
    font-size:20px;
    font-weight:bold;
    color:#667eea;
    margin-bottom:12px;
}

.card-content{
    line-height:1.8;
}

/* 시간표 */
.subject{
    display:flex;
    justify-content:space-between;
    padding:12px;
    border-bottom:1px solid #eee;
}

.subject:last-child{
    border-bottom:none;
}

.period{
    font-weight:bold;
    color:#667eea;
}

</style>
</head>

<body>

<div class="app">

    <!-- 메인 -->
    <div class="home" id="home">

        <div class="logo">🏫</div>

        <div class="title">중마고</div>

        <div class="subtitle">
            학교 생활 앱
        </div>

        <button class="menu-btn"
        onclick="openMeal('today')">
            🍱 오늘 급식
        </button>

        <button class="menu-btn"
        onclick="openMeal('tomorrow')">
            📅 내일 급식
        </button>

        <button class="menu-btn"
        onclick="openTimetable()">
            📚 시간표
        </button>

    </div>

    <!-- 급식 화면 -->
    <div class="screen" id="mealScreen">

        <div class="top-bar">

            <button class="back-btn"
            onclick="goHome()">
                ←
            </button>

            <div class="screen-title"
            id="mealTitle">
                급식
            </div>

        </div>

        <div class="date" id="mealDate"></div>

        <div id="mealContainer"></div>

    </div>

    <!-- 시간표 화면 -->
    <div class="screen" id="timeScreen">

        <div class="top-bar">

            <button class="back-btn"
            onclick="goHome()">
                ←
            </button>

            <div class="screen-title">
                오늘 시간표
            </div>

        </div>

        <div class="card">

            <div class="subject">
                <span class="period">1교시</span>
                <span>수학</span>
            </div>

            <div class="subject">
                <span class="period">2교시</span>
                <span>영어</span>
            </div>

            <div class="subject">
                <span class="period">3교시</span>
                <span>국어</span>
            </div>

            <div class="subject">
                <span class="period">4교시</span>
                <span>과학</span>
            </div>

            <div class="subject">
                <span class="period">5교시</span>
                <span>사회</span>
            </div>

            <div class="subject">
                <span class="period">6교시</span>
                <span>체육</span>
            </div>

            <div class="subject">
                <span class="period">7교시</span>
                <span>정보</span>
            </div>

        </div>

    </div>

</div>

<script>

// ===== 화면 =====
function goHome(){

    document.getElementById("home").style.display =
    "block";

    document.getElementById("mealScreen").style.display =
    "none";

    document.getElementById("timeScreen").style.display =
    "none";

}

// ===== 시간표 =====
function openTimetable(){

    document.getElementById("home").style.display =
    "none";

    document.getElementById("timeScreen").style.display =
    "block";

}

// ===== 급식 =====
async function openMeal(type){

    document.getElementById("home").style.display =
    "none";

    document.getElementById("mealScreen").style.display =
    "block";

    const today = new Date();

    if(type === "tomorrow"){
        today.setDate(today.getDate()+1);

        document.getElementById("mealTitle")
        .innerText = "내일 급식";
    }

    else{

        document.getElementById("mealTitle")
        .innerText = "오늘 급식";
    }

    const year = today.getFullYear();

    const month =
    String(today.getMonth()+1).padStart(2,'0');

    const day =
    String(today.getDate()).padStart(2,'0');

    const ymd = `${year}${month}${day}`;

    document.getElementById("mealDate").innerText =
    `${year}.${month}.${day}`;

    const url =
`https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&MLSV_YMD=${ymd}&Type=json`;

    const container =
    document.getElementById("mealContainer");

    container.innerHTML =
    `<div class="card">불러오는 중...</div>`;

    try{

        const response = await fetch(url);

        const data = await response.json();

        const rows =
        data.mealServiceDietInfo[1].row;

        let html = "";

        rows.forEach(meal => {

            const type =
            meal.MMEAL_SC_NM;

            const menu =
            meal.DDISH_NM
            .replace(/<br\/>/g,"<br>");

            let emoji = "🍽️";

            if(type === "조식"){
                emoji = "🌅";
            }

            else if(type === "중식"){
                emoji = "☀️";
            }

            else if(type === "석식"){
                emoji = "🌙";
            }

            html += `
            <div class="card">

                <div class="card-title">
                    ${emoji} ${type}
                </div>

                <div class="card-content">
                    ${menu}
                </div>

            </div>
            `;

        });

        container.innerHTML = html;

    }catch(error){

        container.innerHTML =
        `<div class="card">
            급식 정보가 없습니다.
        </div>`;
    }

}

</script>

</body>
</html>
