<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중마고 스마트 앱</title>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
        --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        --card-bg: #f8f9fa;
        --text-main: #2d3748;
        --text-muted: #718096;
        --accent-color: #667eea;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .app-container {
        width: 100%;
        max-width: 412px;
        height: 840px;
        max-height: 90vh;
        background: white;
        border-radius: 40px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 40px 24px;
        background: white;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        z-index: 10;
    }

    .home-screen {
        justify-content: center;
        text-align: center;
    }

    .app-logo {
        font-size: 70px;
        margin-bottom: 16px;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .app-title {
        font-size: 36px;
        font-weight: 800;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }

    .app-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin-bottom: 48px;
        font-weight: 500;
    }

    .menu-btn {
        width: 100%;
        padding: 20px;
        border: none;
        border-radius: 20px;
        margin-bottom: 16px;
        background: var(--primary-gradient);
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        transition: transform 0.1s ease, box-shadow 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .menu-btn:active {
        transform: scale(0.97);
    }

    .top-navbar {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
    }

    .back-btn {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: var(--card-bg);
        font-size: 20px;
        font-weight: bold;
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .screen-title {
        flex: 1;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        margin-right: 46px;
    }

    .date-indicator {
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 24px;
    }

    /* 학년/반 선택 바 스타일 */
    .selector-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .selector-container select {
        flex: 1;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background-color: var(--card-bg);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        outline: none;
        cursor: pointer;
    }

    .info-card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 24px;
        margin-bottom: 16px;
        border: 1px solid rgba(0,0,0,0.03);
    }

    .card-header {
        font-size: 18px;
        font-weight: 700;
        color: var(--accent-color);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .card-body {
        line-height: 1.8;
        font-size: 16px;
        color: #4a5568;
    }

    .timetable-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .subject-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 8px;
        border-bottom: 1px solid #edf2f7;
    }

    .subject-row:last-child {
        border-bottom: none;
    }

    .period-tag {
        font-weight: 700;
        color: var(--accent-color);
        background: rgba(102, 126, 234, 0.1);
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 14px;
    }

    .subject-name {
        font-weight: 600;
    }

    .status-msg {
        text-align: center;
        padding: 40px 0;
        color: var(--text-muted);
        font-weight: 500;
        line-height: 1.6;
    }
</style>
</head>
<body>

<div class="app-container">

    <main class="screen active" id="homeScreen">
        <div class="app-logo">🏫</div>
        <h1 class="app-title">중마고등학교</h1>
        <p class="app-subtitle">스마트 루틴 캠퍼스 앱</p>

        <button class="menu-btn" onclick="fetchAndShowMeal('today')">
            <span>🍱</span> 오늘 급식 보기
        </button>
        <button class="menu-btn" onclick="fetchAndShowMeal('tomorrow')">
            <span>📅</span> 내일 급식 보기
        </button>
        <button class="menu-btn" onclick="openTimetableScreen()">
            <span>📚</span> 오늘의 시간표
        </button>
    </main>

    <section class="screen" id="mealScreen">
        <header class="top-navbar">
            <button class="back-btn" onclick="switchScreen('homeScreen')">←</button>
            <h2 class="screen-title" id="mealTitle">급식 정보</h2>
        </header>
        <div class="date-indicator" id="mealDate">0000.00.00</div>
        <div id="mealContainer"></div>
    </section>

    <section class="screen" id="timeScreen">
        <header class="top-navbar">
            <button class="back-btn" onclick="switchScreen('homeScreen')">←</button>
            <h2 class="screen-title">오늘의 시간표</h2>
        </header>
        <div class="date-indicator" id="timetableDate">금일 기준</div>

        <div class="selector-container">
            <select id="gradeSelect" onchange="fetchTimetable()">
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
            </select>
            <select id="classSelect" onchange="fetchTimetable()">
                <option value="1">1반</option>
                <option value="2">2반</option>
                <option value="3">3반</option>
                <option value="4">4반</option>
                <option value="5">5반</option>
            </select>
        </div>

        <div class="info-card timetable-list" id="timetableContainer"></div>
    </section>

</div>

<script>
// ===== [공통] 화면 라우팅 =====
function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
}

// ===== [급식] API 연동 =====
async function fetchAndShowMeal(targetType) {
    switchScreen('mealScreen');
    
    const targetDate = new Date();
    if (targetType === "tomorrow") {
        targetDate.setDate(targetDate.getDate() + 1);
        document.getElementById("mealTitle").innerText = "내일 급식";
    } else {
        document.getElementById("mealTitle").innerText = "오늘 급식";
    }

    const year = targetDate.getFullYear();
    const month = String(targetDate.getMonth() + 1).padStart(2, '0');
    const date = String(targetDate.getDate()).padStart(2, '0');
    const ymd = `${year}${month}${date}`;

    document.getElementById("mealDate").innerText = `${year}.${month}.${date}`;

    const container = document.getElementById("mealContainer");
    container.innerHTML = `<div class="status-msg">🍱 맛있는 급식을 가져오는 중...</div>`;

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&MLSV_YMD=${ymd}&Type=json`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.mealServiceDietInfo) {
            container.innerHTML = `<div class="status-msg">정규 급식 정보가 없거나<br>주말/공휴일입니다. 😴</div>`;
            return;
        }

        const rows = data.mealServiceDietInfo[1].row;
        let combinedHtml = "";

        rows.forEach(meal => {
            const mealType = meal.MMEAL_SC_NM;
            const cleanedMenu = meal.DDISH_NM
                .replace(/\([0-9./*]*\)/g, "")
                .replace(/\s+/g, " ")
                .replace(/<br\/>/g, "<br>");

            let emoji = "🍽️";
            if (mealType === "조식") emoji = "🌅";
            else if (mealType === "중식") emoji = "☀️";
            else if (mealType === "석식") emoji = "🌙";

            combinedHtml += `
                <div class="info-card">
                    <div class="card-header">${emoji} ${mealType}</div>
                    <div class="card-body">${cleanedMenu}</div>
                </div>
            `;
        });

        container.innerHTML = combinedHtml;
    } catch (error) {
        container.innerHTML = `<div class="status-msg">⚠️ 데이터를 불러오지 못했습니다.</div>`;
    }
}

// ===== [시간표] 실시간 연동 비즈니스 로직 =====
function openTimetableScreen() {
    switchScreen('timeScreen');
    fetchTimetable(); // 화면을 열 때 자동으로 시간표를 불러옴
}

async function fetchTimetable() {
    const container = document.getElementById("timetableContainer");
    container.innerHTML = `<div class="status-msg">📚 오늘의 교실 시간표를 조회하는 중...</div>`;

    // 1. 현재 날짜 정보 및 드롭다운 선택값 가져오기
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const date = String(today.getDate()).padStart(2, '0');
    const ymd = `${year}${month}${date}`;

    const week = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById("timetableDate").innerText = `${today.getMonth()+1}월 ${today.getDate()}일 (${week[today.getDay()]}요일)`;

    const grade = document.getElementById("gradeSelect").value;
    const classNm = document.getElementById("classSelect").value;

    // 2. 나이스 고등학교 시간표 API 주소 구성
    const API_URL = 'https://open.neis.go.kr/hub/hisTimetable';
    const OFFICE_CODE = 'Q10'; // 전남교육청
    const SCHOOL_CODE = '8490283'; // 중마고등학교
    const url = `${API_URL}?ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&ALL_TI_YMD=${ymd}&GRADE=${grade}&CLASS_NM=${classNm}&Type=json`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        // 시간표 정보가 없는 경우 (주말, 공휴일, 방학 등)
        if (!data.hisTimetable) {
            container.innerHTML = `<div class="status-msg">오늘 주말이거나 수업 정보가 없습니다. ✨</div>`;
            return;
        }

        const rows = data.hisTimetable[1].row;

        // 교시(PERIO) 순서대로 정렬 (나이스 API는 간혹 순서가 섞여서 올 수 있음)
        rows.sort((a, b) => parseInt(a.PERIO) - parseInt(b.PERIO));

        let html = "";
        rows.forEach(row => {
            const period = row.PERIO; // 몇 교시
            const subject = row.ITRT_CNTNT; // 과목명 (예: 수학, 영어)

            html += `
                <div class="subject-row">
                    <span class="period-tag">${period}교시</span>
                    <span class="subject-name">${subject}</span>
                </div>
            `;
        });

        container.innerHTML = html;

    } catch (error) {
        console.error("시간표 로딩 에러:", error);
        container.innerHTML = `<div class="status-msg">⚠️ 시간표를 불러오는데 실패했습니다.</div>`;
    }
}
</script>

</body>
</html>
