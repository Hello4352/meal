<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중마고 스마트 급식 앱</title>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
        --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        --card-bg: #f8f9fa;
        --text-main: #2d3748;
        --text-muted: #718096;
        --accent-color: #667eea;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .app-container {
        width: 100%;
        max-width: 412px;
        height: 840px;
        max-height: 90vh;
        background: white;
        border-radius: 40px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 40px 24px;
        background: white;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        z-index: 10;
    }

    .home-screen {
        justify-content: center;
        text-align: center;
    }

    .app-logo {
        font-size: 70px;
        margin-bottom: 16px;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .app-title {
        font-size: 36px;
        font-weight: 800;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }

    .app-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin-bottom: 40px;
        font-weight: 500;
    }

    /* 날짜 선택 섹션 스타일 */
    .date-select-box {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 24px;
        margin-bottom: 24px;
        border: 1px solid #e2e8f0;
    }

    .date-select-label {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 10px;
        display: block;
        text-align: left;
    }

    .date-input-wrapper {
        display: flex;
        gap: 10px;
    }

    .date-picker {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #cbd5e0;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        color: var(--text-main);
        outline: none;
        background: white;
    }

    .go-btn {
        padding: 0 20px;
        border: none;
        border-radius: 14px;
        background: var(--primary-gradient);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .menu-btn {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 20px;
        margin-bottom: 12px;
        background: #f1f3f9;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s ease, background 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .menu-btn.primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
    }

    .menu-btn:active {
        transform: scale(0.98);
    }

    .top-navbar {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
    }

    .back-btn {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: var(--card-bg);
        font-size: 20px;
        font-weight: bold;
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .screen-title {
        flex: 1;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        margin-right: 46px;
    }

    .date-indicator {
        text-align: center;
        color: var(--text-muted);
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 24px;
        background: #edf2f7;
        padding: 8px 16px;
        border-radius: 30px;
        display: inline-block;
        align-self: center;
    }

    /* 급식 카드 디자인 */
    .info-card {
        background: var(--card-bg);
        border-radius: 22px;
        padding: 20px;
        margin-bottom: 16px;
        border: 1px solid rgba(0, 0, 0, 0.03);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card-header {
        font-size: 18px;
        font-weight: 800;
        color: #4a5568;
        margin-bottom: 12px;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 6px;
    }

    .card-body {
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-main);
        font-weight: 500;
    }

    .status-msg {
        text-align: center;
        color: var(--text-muted);
        font-size: 16px;
        padding: 40px 20px;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="app-container">

    <main class="screen active" id="homeScreen">
        <div class="app-logo">🍱</div>
        <h1 class="app-title">중마고 급식실</h1>
        <p class="app-subtitle">스마트 날짜별 급식 조회 시스템</p>

        <div class="date-select-box">
            <label class="date-select-label" for="customDate">📅 다른 날짜 급식 찾기</label>
            <div class="date-input-wrapper">
                <input type="date" id="customDate" class="date-picker">
                <button class="go-btn" onclick="fetchCustomDateMeal()">조회</button>
            </div>
        </div>

        <button class="menu-btn primary" onclick="fetchAndShowMeal('today')">
            <span>☀️</span> 오늘 급식 바로보기
        </button>
        <button class="menu-btn" onclick="fetchAndShowMeal('tomorrow')">
            <span>🌙</span> 내일 급식 바로보기
        </button>
    </main>

    <section class="screen" id="mealScreen">
        <header class="top-navbar">
            <button class="back-btn" onclick="switchScreen('homeScreen')">←</button>
            <h2 class="screen-title" id="mealTitle">급식 정보</h2>
        </header>
        <div class="date-indicator" id="mealDate">0000.00.00</div>
        <div id="mealContainer"></div>
    </section>

</div>

<script>
// 앱 시작 시 날짜 선택기의 기본값을 오늘 날짜로 세팅
document.getElementById('customDate').value = new Date().toISOString().substring(0, 10);

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
}

// 달력에서 날짜를 선택해 조회할 때 실행되는 함수
function fetchCustomDateMeal() {
    const dateInput = document.getElementById('customDate').value;
    if (!dateInput) {
        alert('날짜를 정확히 선택해 주세요!');
        return;
    }
    // 하이픈(-) 제거하여 YMD 포맷 생성
    const ymd = dateInput.replace(/-/g, "");
    const formattedDate = dateInput.replace(/-/g, ".");
    
    document.getElementById("mealTitle").innerText = "선택한 날 급식";
    document.getElementById("mealDate").innerText = formattedDate;
    
    executeMealApi(ymd);
}

// 오늘 / 내일 퀵 버튼 전용 함수
async function fetchAndShowMeal(targetType) {
    const targetDate = new Date();
    if (targetType === "tomorrow") {
        targetDate.setDate(targetDate.getDate() + 1);
        document.getElementById("mealTitle").innerText = "내일 급식";
    } else {
        document.getElementById("mealTitle").innerText = "오늘 급식";
    }

    const year = targetDate.getFullYear();
    const month = String(targetDate.getMonth() + 1).padStart(2, '0');
    const date = String(targetDate.getDate()).padStart(2, '0');
    const ymd = `${year}${month}${date}`;

    document.getElementById("mealDate").innerText = `${year}.${month}.${date}`;

    executeMealApi(ymd);
}

// 공통 핵심 API 요청 엔진
async function executeMealApi(ymd) {
    switchScreen('mealScreen');
    const container = document.getElementById("mealContainer");
    container.innerHTML = `<div class="status-msg">🍱 중마고 급식 데이터를 불러오는 중...</div>`;

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&MLSV_YMD=${ymd}&Type=json`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.mealServiceDietInfo) {
            container.innerHTML = `<div class="status-msg">해당 날짜에는 급식 정보가 없거나<br>주말 혹은 휴업일입니다. 😴</div>`;
            return;
        }

        const rows = data.mealServiceDietInfo[1].row;
        let combinedHtml = "";

        rows.forEach(meal => {
            const mealType = meal.MMEAL_SC_NM; // 조식, 중식, 석식 구분
            
            // 영양정보 알레르기 숫자 및 불필요한 공백 제거 깔끔화 공정
            const cleanedMenu = meal.DDISH_NM
                .replace(/\([0-9./*]*\)/g, "")
                .replace(/\s+/g, " ")
                .replace(/<br\/>/g, "<br>");

            let emoji = "🍽️";
            if (mealType === "조식") emoji = "🌅";
            else if (mealType === "중식") emoji = "☀️";
            else if (mealType === "석식") emoji = "🌙";

            combinedHtml += `
                <div class="info-card">
                    <div class="card-header">${emoji} ${mealType}</div>
                    <div class="card-body">${cleanedMenu}</div>
                </div>
            `;
        });

        container.innerHTML = combinedHtml;
    } catch (error) {
        console.error("급식 로딩 에러:", error);
        container.innerHTML = `<div class="status-msg">⚠️ 데이터를 가져오는 중 오류가 발생했습니다. 다시 시도해 주세요.</div>`;
    }
}
</script>

</body>
</html>
