<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중마고 스마트 앱</title>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
        --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        --card-bg: #f8f9fa;
        --text-main: #2d3748;
        --text-muted: #718096;
        --accent-color: #667eea;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .app-container {
        width: 100%;
        max-width: 412px;
        height: 840px;
        max-height: 90vh;
        background: white;
        border-radius: 40px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 40px 24px;
        background: white;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
        z-index: 10;
    }

    .home-screen {
        justify-content: center;
        text-align: center;
    }

    .app-logo {
        font-size: 70px;
        margin-bottom: 16px;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .app-title {
        font-size: 36px;
        font-weight: 800;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }

    .app-subtitle {
        color: var(--text-muted);
        font-size: 16px;
        margin-bottom: 48px;
        font-weight: 500;
    }

    .menu-btn {
        width: 100%;
        padding: 20px;
        border: none;
        border-radius: 20px;
        margin-bottom: 16px;
        background: var(--primary-gradient);
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        transition: transform 0.1s ease, box-shadow 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .menu-btn:active {
        transform: scale(0.97);
    }

    .top-navbar {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
    }

    .back-btn {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: var(--card-bg);
        font-size: 20px;
        font-weight: bold;
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .screen-title {
        flex: 1;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        margin-right: 46px;
    }

    .date-indicator {
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 24px;
    }

    .selector-container {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
    }

    .selector-container select {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background-color: var(--card-bg);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        outline: none;
        cursor: pointer;
    }

    .day-card {
        background: var(--card-bg);
        border-radius: 22px;
        padding: 18px 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        transition: all 0.3s ease;
    }

    .day-title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 14px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .day-card.is-today {
        background: #f0f4ff;
        border: 2.5px solid #667eea;
        box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
        transform: scale(1.01);
    }

    .day-card.is-today .day-title {
        color: #764ba2;
        font-size: 18px;
        font-weight: 800;
    }

    .today-badge {
        background: var(--primary-gradient);
        color: white;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .day-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .period-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 6px;
        border-bottom: 1px dashed #e2e8f0;
    }

    .period-row:last-child {
        border-bottom: none;
    }

    /* [신규 디자인 개편] 수업이 없을 때 스타일 처리 */
    .period-row.no-class {
        opacity: 0.55; /* 줄 전체를 은은하게 반투명 처리 */
    }

    .p-num {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
    }

    .day-card.is-today .p-num {
        color: var(--accent-color);
    }

    .p-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
    }

    .day-card.is-today .p-name {
        font-weight: 800;
        color: #1a202c;
    }

    /* 수업 없음 텍스트 스타일 */
    .p-name.empty-text {
        color: #a0aec0;
        font-weight: 400;
        font-style: italic;
    }
</style>
</head>
<body>

<div class="app-container">

    <main class="screen active" id="homeScreen">
        <div class="app-logo">🏫</div>
        <h1 class="app-title">중마고등학교</h1>
        <p class="app-subtitle">스마트 루틴 캠퍼스 앱</p>

        <button class="menu-btn" onclick="fetchAndShowMeal('today')">
            <span>🍱</span> 오늘 급식 보기
        </button>
        <button class="menu-btn" onclick="fetchAndShowMeal('tomorrow')">
            <span>📅</span> 내일 급식 보기
        </button>
        <button class="menu-btn" onclick="openTimetableScreen()">
            <span>📚</span> 주간 시간표 보기
        </button>
    </main>

    <section class="screen" id="mealScreen">
        <header class="top-navbar">
            <button class="back-btn" onclick="switchScreen('homeScreen')">←</button>
            <h2 class="screen-title" id="mealTitle">급식 정보</h2>
        </header>
        <div class="date-indicator" id="mealDate">0000.00.00</div>
        <div id="mealContainer"></div>
    </section>

    <section class="screen" id="timeScreen">
        <header class="top-navbar">
            <button class="back-btn" onclick="switchScreen('homeScreen')">←</button>
            <h2 class="screen-title">주간 시간표</h2>
        </header>
        <div class="date-indicator" id="timetableRangeTitle">이번 주 학급 수업</div>

        <div class="selector-container">
            <select id="gradeSelect" onchange="fetchWeeklyTimetable()">
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
            </select>
            <select id="classSelect" onchange="fetchWeeklyTimetable()">
                <option value="1">1반</option>
                <option value="2">2반</option>
                <option value="3">3반</option>
                <option value="4">4반</option>
                <option value="5">5반</option>
            </select>
        </div>

        <div id="timetableContainer"></div>
    </section>

</div>

<script>
function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });
    document.getElementById(screenId).classList.add('active');
}

async function fetchAndShowMeal(targetType) {
    switchScreen('mealScreen');
    
    const targetDate = new Date();
    if (targetType === "tomorrow") {
        targetDate.setDate(targetDate.getDate() + 1);
        document.getElementById("mealTitle").innerText = "내일 급식";
    } else {
        document.getElementById("mealTitle").innerText = "오늘 급식";
    }

    const year = targetDate.getFullYear();
    const month = String(targetDate.getMonth() + 1).padStart(2, '0');
    const date = String(targetDate.getDate()).padStart(2, '0');
    const ymd = `${year}${month}${date}`;

    document.getElementById("mealDate").innerText = `${year}.${month}.${date}`;

    const container = document.getElementById("mealContainer");
    container.innerHTML = `<div class="status-msg">🍱 맛있는 급식을 가져오는 중...</div>`;

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&MLSV_YMD=${ymd}&Type=json`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.mealServiceDietInfo) {
            container.innerHTML = `<div class="status-msg">정규 급식 정보가 없거나<br>주말/공휴일입니다. 😴</div>`;
            return;
        }

        const rows = data.mealServiceDietInfo[1].row;
        let combinedHtml = "";

        rows.forEach(meal => {
            const mealType = meal.MMEAL_SC_NM;
            const cleanedMenu = meal.DDISH_NM
                .replace(/\([0-9./*]*\)/g, "")
                .replace(/\s+/g, " ")
                .replace(/<br\/>/g, "<br>");

            let emoji = "🍽️";
            if (mealType === "조식") emoji = "🌅";
            else if (mealType === "중식") emoji = "☀️";
            else if (mealType === "석식") emoji = "🌙";

            combinedHtml += `
                <div class="info-card">
                    <div class="card-header">${emoji} ${mealType}</div>
                    <div class="card-body">${cleanedMenu}</div>
                </div>
            `;
        });

        container.innerHTML = combinedHtml;
    } catch (error) {
        container.innerHTML = `<div class="status-msg">⚠️ 데이터를 불러오지 못했습니다.</div>`;
    }
}

function getWeekDates() {
    const current = new Date();
    const currentDay = current.getDay();
    const startOfWeek = new Date(current);
    
    const distanceToMonday = (currentDay === 0) ? -6 : 1 - currentDay;
    startOfWeek.setDate(current.getDate() + distanceToMonday);
    
    const weekArr = [];
    for (let i = 0; i < 5; i++) {
        const targetDay = new Date(startOfWeek);
        targetDay.setDate(startOfWeek.getDate() + i);
        weekArr.push(targetDay);
    }
    return weekArr;
}

function openTimetableScreen() {
    switchScreen('timeScreen');
    fetchWeeklyTimetable();
}

async function fetchWeeklyTimetable() {
    const container = document.getElementById("timetableContainer");
    container.innerHTML = `<div class="status-msg">📚 이번 주 월~금 주간 시간표를 가져오고 있습니다...</div>`;

    const grade = document.getElementById("gradeSelect").value;
    const classNm = document.getElementById("classSelect").value;

    const weekDays = getWeekDates();
    const today = new Date();
    const todayYMD = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
    
    const dayNames = ['월', '화', '수', '목', '금'];
    
    const firstDay = weekDays[0];
    const lastDay = weekDays[4];
    document.getElementById("timetableRangeTitle").innerText = `${firstDay.getMonth()+1}/${firstDay.getDate()} ~ ${lastDay.getMonth()+1}/${lastDay.getDate()} 기준`;

    try {
        const fetchPromises = weekDays.map(day => {
            const ymd = `${day.getFullYear()}${String(day.getMonth() + 1).padStart(2, '0')}${String(day.getDate()).padStart(2, '0')}`;
            const url = `https://open.neis.go.kr/hub/hisTimetable?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&ALL_TI_YMD=${ymd}&GRADE=${grade}&CLASS_NM=${classNm}&Type=json`;
            return fetch(url).then(res => res.json());
        });

        const results = await Promise.all(fetchPromises);
        let totalHtml = "";

        results.forEach((data, index) => {
            const targetDate = weekDays[index];
            const ymdString = `${targetDate.getFullYear()}${String(targetDate.getMonth() + 1).padStart(2, '0')}${String(targetDate.getDate()).padStart(2, '0')}`;
            const isToday = (ymdString === todayYMD);

            // 초기 가상 시간표 어레이 선언 (빈 문자열)
            const periods = Array(7).fill("");

            if (data.hisTimetable) {
                const rows = data.hisTimetable[1].row;
                rows.forEach(row => {
                    const pNum = parseInt(row.PERIO);
                    if (pNum >= 1 && pNum <= 7) {
                        // 공백을 완벽 제거(.trim())하고 나이스 표준 명칭인 ITRT_CNTNT만 정확히 바인딩
                        periods[pNum - 1] = row.ITRT_CNTNT ? row.ITRT_CNTNT.trim() : "";
                    }
                });
            }

            const cardHighlightClass = isToday ? "is-today" : "";
            const todayBadge = isToday ? "<span class='today-badge'>TODAY</span>" : "";

            totalHtml += `
                <div class="day-card ${cardHighlightClass}">
                    <div class="day-title">
                        <span>${dayNames[index]}요일 (${targetDate.getMonth()+1}/${targetDate.getDate()})</span>
                        ${todayBadge}
                    </div>
                    <div class="day-grid">
            `;

            for (let p = 1; p <= 7; p++) {
                let subjectShow = periods[p-1];
                let rowClass = "";
                let textClass = "";
                
                // 학교 측에서 정규 수업을 등록하지 않았거나 비워둔 교시일 때의 예외 처리 단락
                if (!subjectShow) {
                    subjectShow = "수업 없음 (또는 행사)";
                    rowClass = "no-class";
                    textClass = "empty-text";
                }

                totalHtml += `
                    <div class="period-row ${rowClass}">
                        <span class="p-num">${p}교시</span>
                        <span class="p-name ${textClass}">${subjectShow}</span>
                    </div>
                `;
            }

            totalHtml += `
                    </div>
                </div>
            `;
        });

        container.innerHTML = totalHtml;

        setTimeout(() => {
            const todayCard = document.querySelector('.day-card.is-today');
            if (todayCard) {
                todayCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }, 150);

    } catch (error) {
        console.error("주간 시간표 로딩 오류:", error);
        container.innerHTML = `<div class="status-msg">⚠️ 시간표를 원활하게 불러오지 못했습니다.</div>`;
    }
}
</script>

</body>
</html>
