<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>중마고 급식</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* 전체 앱 */
.app{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:35px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

/* 메인 화면 */
.home{
    padding:60px 30px;
    text-align:center;
}

.logo{
    font-size:55px;
    margin-bottom:20px;
}

.title{
    font-size:38px;
    font-weight:bold;
    margin-bottom:10px;
    color:#333;
}

.subtitle{
    color:gray;
    margin-bottom:50px;
    font-size:16px;
}

/* 버튼 */
.meal-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.meal-btn:hover{
    transform:scale(1.03);
}

/* 급식 화면 */
.meal-screen{
    display:none;
    padding:25px;
}

.top-bar{
    display:flex;
    align-items:center;
    margin-bottom:25px;
}

.back-btn{
    border:none;
    background:#f1f1f1;
    width:45px;
    height:45px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.screen-title{
    flex:1;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-right:45px;
}

/* 날짜 */
.date{
    text-align:center;
    color:gray;
    margin-bottom:25px;
}

/* 급식 카드 */
.meal-card{
    background:#f7f7fb;
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.meal-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
    color:#667eea;
}

.meal-menu{
    line-height:1.9;
    color:#333;
}

/* 로딩 */
.loading{
    text-align:center;
    color:gray;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="app">

    <!-- 메인 화면 -->
    <div class="home" id="home">

        <div class="logo">🏫</div>

        <div class="title">중마고</div>

        <div class="subtitle">
            오늘의 급식을 확인해보세요
        </div>

        <button class="meal-btn" onclick="showMeals()">
            🍱 오늘 급식 보기
        </button>

    </div>

    <!-- 급식 화면 -->
    <div class="meal-screen" id="mealScreen">

        <div class="top-bar">

            <button class="back-btn"
            onclick="goBack()">
                ←
            </button>

            <div class="screen-title">
                오늘 급식
            </div>

        </div>

        <div class="date" id="date"></div>

        <div id="mealContainer">

            <div class="loading">
                급식 불러오는 중...
            </div>

        </div>

    </div>

</div>

<script>

// ===== 화면 전환 =====
function showMeals(){

    document.getElementById("home").style.display =
    "none";

    document.getElementById("mealScreen").style.display =
    "block";

    loadMeals();

}

function goBack(){

    document.getElementById("mealScreen").style.display =
    "none";

    document.getElementById("home").style.display =
    "block";

}

// ===== 오늘 날짜 =====
const today = new Date();

const year = today.getFullYear();

const month =
String(today.getMonth()+1).padStart(2,'0');

const day =
String(today.getDate()).padStart(2,'0');

const ymd = `${year}${month}${day}`;

document.getElementById("date").innerText =
`${year}.${month}.${day}`;

// ===== API =====
const url =
`https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=Q10&SD_SCHUL_CODE=8490283&MLSV_YMD=${ymd}&Type=json`;

// ===== 급식 불러오기 =====
async function loadMeals(){

    const container =
    document.getElementById("mealContainer");

    container.innerHTML =
    `<div class="loading">불러오는 중...</div>`;

    try{

        const response = await fetch(url);

        const data = await response.json();

        const rows =
        data.mealServiceDietInfo[1].row;

        let html = "";

        rows.forEach(meal => {

            const type =
            meal.MMEAL_SC_NM;

            const menu =
            meal.DDISH_NM
            .replace(/<br\/>/g,"<br>");

            let emoji = "🍽️";

            if(type === "조식"){
                emoji = "🌅";
            }

            else if(type === "중식"){
                emoji = "☀️";
            }

            else if(type === "석식"){
                emoji = "🌙";
            }

            html += `
            <div class="meal-card">

                <div class="meal-name">
                    ${emoji} ${type}
                </div>

                <div class="meal-menu">
                    ${menu}
                </div>

            </div>
            `;

        });

        container.innerHTML = html;

    }catch(error){

        container.innerHTML = `
        <div class="meal-card">
            급식 정보가 없습니다.
        </div>
        `;

    }

}

</script>

</body>
</html>
